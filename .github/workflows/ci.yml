name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Actions の画面から版番号を入れて正式リリースを出す。手元に git がなくてもタグを打てるようにするため。
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースする版（例: v0.1.0）。main の最新コミットにこのタグを付ける'
        required: true
  # コードを変えていなくても、依存に新しく見つかった脆弱性に気づけるよう、週 1 回 deny だけを走らせる。
  schedule:
    - cron: '0 0 * * 1'

# Actions にはコードを読む権限だけを渡す。書き込みが要るジョブ（release）だけ個別に広げる。
permissions:
  contents: read

jobs:
  # 依存クレートの既知の脆弱性（RustSec）・取り下げられた版・crates.io 以外の取得元を止める。
  # 設定は deny.toml。ライセンスはビルドの中の cargo-about で確かめる。
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories sources

  build:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 版は古めの Ubuntu でビルドする。glibc は新しい版でビルドしたものが
          # 古い版で動かないので、22.04 でビルドして 22.04 以降すべてで動くようにする。
          - os: ubuntu-22.04
            package: vw-linux-x64.tar.gz
            dicoamplio_package: dicoamplio-linux-x64.tar.gz
          - os: windows-latest
            package: vw-windows-x64.zip
            dicoamplio_package: dicoamplio-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Actions はタグではなくコミットで固定する。タグは付け替えられるので、配布物のビルドに
      # 知らない変更が入り込むのを防ぐため。更新は Dependabot（.github/dependabot.yml）の PR で行う。
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      # --locked: Cargo.lock にない版を取ってこないよう、コミットした依存のままビルドする。
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about
      # アプリごとに集める。--workspace だと、片方のアプリしか使わない依存(CharLS など)が両方の一覧に載る
      - name: Collect third-party licenses
        run: |
          cargo about generate -c packaging/about.toml packaging/about.hbs --manifest-path apps/vw/Cargo.toml -o THIRD-PARTY-LICENSES.txt
          cargo about generate -c packaging/about.toml packaging/about-dicoamplio.hbs --manifest-path apps/dicoamplio/Cargo.toml -o THIRD-PARTY-LICENSES-dicoamplio.txt

      - name: Check setup scripts
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/setup-ubuntu.sh
          bash -n packaging/linux/install.sh
      - name: Check setup scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\setup-windows.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

      # apps/ のアプリを 1 つずつ別の書庫にする。使う人が要るものだけ取れるように
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/vw dist/dicoamplio
          cp target/release/vw README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt packaging/linux/vw.desktop packaging/linux/install.sh packaging/icons/vw.png dist/vw/
          tar -C dist -czf dist/${{ matrix.package }} vw
          cp target/release/dicoamplio apps/dicoamplio/README.md LICENSE-MIT LICENSE-APACHE dist/dicoamplio/
          cp THIRD-PARTY-LICENSES-dicoamplio.txt dist/dicoamplio/THIRD-PARTY-LICENSES.txt
          cp -r apps/dicoamplio/presets apps/dicoamplio/examples dist/dicoamplio/
          tar -C dist -czf dist/${{ matrix.dicoamplio_package }} dicoamplio
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/vw, dist/dicoamplio | Out-Null
          Copy-Item target/release/vw.exe, README.md, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-LICENSES.txt dist/vw/
          Compress-Archive -Path dist/vw -DestinationPath dist/${{ matrix.package }}
          Copy-Item target/release/dicoamplio.exe, apps/dicoamplio/README.md, LICENSE-MIT, LICENSE-APACHE dist/dicoamplio/
          Copy-Item THIRD-PARTY-LICENSES-dicoamplio.txt dist/dicoamplio/THIRD-PARTY-LICENSES.txt
          Copy-Item -Recurse apps/dicoamplio/presets, apps/dicoamplio/examples dist/dicoamplio/
          Compress-Archive -Path dist/dicoamplio -DestinationPath dist/${{ matrix.dicoamplio_package }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.package }}
          path: |
            dist/${{ matrix.package }}
            dist/${{ matrix.dicoamplio_package }}

  # main への push と v* タグの push で、両 OS のビルドとテストが通ったら Release に載せる。
  # apps/ のアプリは同じ版で一緒に出す(vw と dicoamplio の書庫が 1 つの Release に並ぶ)。
  # プルリクエストでは載せない（未マージの変更を配布しないため）。
  # 既知の脆弱性がある依存のビルドは配布しない。
  release:
    needs: [build, deny]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # main への push が続いたとき、削除と作成が入り混じらないよう 1 つずつ実行する。
    concurrency: release
    permissions:
      contents: write
      # artifact attestation（どのワークフローのどのコミットで作ったかの証明）に署名して記録するため。
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # 利用者がダウンロードしたファイルを確かめられるよう、SHA-256 の一覧を一緒に置く。
      - name: Checksums
        run: |
          cd dist
          sha256sum vw-* dicoamplio-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # 一覧だけでは、Release ごと差し替えられたときに一覧も一緒に差し替えられてしまう。
      # attestation は GitHub が CI の実行に結び付けて記録するので、ここで作ったものかを別に確かめられる。
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/vw-*
            dist/dicoamplio-*
      - name: Publish main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # main の最新ビルドは 1 つのプレリリースを作り直して置き換える。
        # push のたびに新しいリリースを作ると一覧が埋まり、正式版が探しにくくなるため。
        run: |
          gh release delete main-latest --yes --cleanup-tag || true
          gh release create main-latest dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "最新ビルド (main)" \
            --notes "main ブランチの最新コミット ${GITHUB_SHA::7} のビルドです。正式版ではありません。"
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "vw $GITHUB_REF_NAME" \
            --generate-notes
      - name: Publish release from the Actions page
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        # タグは gh release create に作らせる。GITHUB_TOKEN で作ったタグは push のワークフローを
        # 起動しないので、上の「Publish versioned release」と二重にリリースされることはない。
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::main から実行してください（今は $GITHUB_REF）"; exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版は v0.1.0 の形で入れてください（入力: $VERSION）"; exit 1
          fi
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "vw $VERSION" \
            --generate-notes
