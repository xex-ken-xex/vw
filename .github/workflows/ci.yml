name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Actions の画面から版番号を入れて正式リリースを出す。手元に git がなくてもタグを打てるようにするため。
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースする版（例: v0.1.0）。main の最新コミットにこのタグを付ける'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 版は古めの Ubuntu でビルドする。glibc は新しい版でビルドしたものが
          # 古い版で動かないので、22.04 でビルドして 22.04 以降すべてで動くようにする。
          - os: ubuntu-22.04
            package: vw-linux-x64.tar.gz
          - os: windows-latest
            package: vw-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

      - name: Check setup scripts
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/setup-ubuntu.sh
          bash -n packaging/linux/install.sh
      - name: Check setup scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\setup-windows.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/vw
          cp target/release/vw README.md packaging/linux/vw.desktop packaging/linux/install.sh dist/vw/
          tar -C dist -czf dist/${{ matrix.package }} vw
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/vw | Out-Null
          Copy-Item target/release/vw.exe, README.md dist/vw/
          Compress-Archive -Path dist/vw -DestinationPath dist/${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}

  # main への push と v* タグの push で、両 OS のビルドとテストが通ったら Release に載せる。
  # プルリクエストでは載せない（未マージの変更を配布しないため）。
  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # main への push が続いたとき、削除と作成が入り混じらないよう 1 つずつ実行する。
    concurrency: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # main の最新ビルドは 1 つのプレリリースを作り直して置き換える。
        # push のたびに新しいリリースを作ると一覧が埋まり、正式版が探しにくくなるため。
        run: |
          gh release delete main-latest --yes --cleanup-tag || true
          gh release create main-latest dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "最新ビルド (main)" \
            --notes "main ブランチの最新コミット ${GITHUB_SHA::7} のビルドです。正式版ではありません。"
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "vw $GITHUB_REF_NAME" \
            --generate-notes
      - name: Publish release from the Actions page
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        # タグは gh release create に作らせる。GITHUB_TOKEN で作ったタグは push のワークフローを
        # 起動しないので、上の「Publish versioned release」と二重にリリースされることはない。
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::main から実行してください（今は $GITHUB_REF）"; exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版は v0.1.0 の形で入れてください（入力: $VERSION）"; exit 1
          fi
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "vw $VERSION" \
            --generate-notes
