name: Pages

# site/ の紹介ページを GitHub Pages に出す。スクリーンショットは README と同じ docs/ のものを
# 使い回し、ビルド時にコピーする（site/ に複製を置くと README と食い違うため）。
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/screenshot.png'
      - 'docs/images/**'
      - 'packaging/icons/vw.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp -r site/. _site/
          cp docs/screenshot.png docs/images/*.png packaging/icons/vw.png _site/images/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
