[workspace]
resolver = "2"
members = ["crates/vw-core", "crates/vw-png", "crates/vw-jpeg", "crates/vw-bmp", "crates/vw-webp", "crates/vw-gif", "crates/vw-tiff", "crates/vw-raw", "crates/vw-dicom", "crates/vw-quality", "crates/vw-ui", "crates/vw-dock", "crates/vw-log", "crates/vw-app"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["xex (xex-ken-xex)"]
repository = "https://github.com/xex-ken-xex/vw"

[workspace.dependencies]
vw-core = { path = "crates/vw-core" }
vw-png = { path = "crates/vw-png" }
vw-jpeg = { path = "crates/vw-jpeg" }
vw-bmp = { path = "crates/vw-bmp" }
vw-webp = { path = "crates/vw-webp" }
vw-gif = { path = "crates/vw-gif" }
vw-tiff = { path = "crates/vw-tiff" }
vw-raw = { path = "crates/vw-raw" }
vw-dicom = { path = "crates/vw-dicom" }
vw-quality = { path = "crates/vw-quality" }
vw-ui = { path = "crates/vw-ui" }
vw-dock = { path = "crates/vw-dock" }
vw-log = { path = "crates/vw-log" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Image decoding is painfully slow unoptimized; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 3

# Windows で拡大率の違うモニタ間をドラッグすると、ウインドウがちらつきながら伸び縮みを繰り返す
# winit 0.30.13 の不具合を直した写し（vendor/winit/README-vw.md）。上流が直した版を出したら外す。
[patch.crates-io]
winit = { path = "vendor/winit" }
