[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# DicoAmplio はビルドと配布から外している。直す必要が出たらここから消して戻す。
# ソースごと消さないのは、戻すときに作り直さずに済むようにするため。
exclude = ["apps/dicoamplio"]

[workspace.package]
version = "0.9.0"
edition = "2024"
# 依存（egui 0.36）が求める最低の版。cargo update は、この版で使える範囲に解決する（resolver 3）。
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["xex (xex-ken-xex)"]
repository = "https://github.com/xex-ken-xex/vw"

[workspace.dependencies]
vw-core = { path = "crates/vw-core" }
vw-png = { path = "crates/vw-png" }
vw-jpeg = { path = "crates/vw-jpeg" }
vw-bmp = { path = "crates/vw-bmp" }
vw-webp = { path = "crates/vw-webp" }
vw-gif = { path = "crates/vw-gif" }
vw-tiff = { path = "crates/vw-tiff" }
vw-fits = { path = "crates/vw-fits" }
vw-raw = { path = "crates/vw-raw" }
vw-dicom = { path = "crates/vw-dicom" }
vw-quality = { path = "crates/vw-quality" }
vw-compare = { path = "crates/vw-compare" }
vw-ui = { path = "crates/vw-ui" }
vw-tree = { path = "crates/vw-tree" }
vw-dock = { path = "crates/vw-dock" }
vw-log = { path = "crates/vw-log" }
vw-launch = { path = "crates/vw-launch" }
vw-renderer = { path = "crates/vw-renderer" }
vw-pipeline = { path = "crates/vw-pipeline" }
vw-report = { path = "crates/vw-report" }
vw-netcdf = { path = "crates/vw-netcdf" }

[profile.release]
lto = "thin"
codegen-units = 1
# abort にしない。画像の読み込みやカタログの登録は、デコーダが壊れたファイルで panic しても
# catch_unwind でそのファイルだけ飛ばす作りで、abort ではアプリごと落ちるため。
panic = "unwind"
strip = true

# Image decoding is painfully slow unoptimized; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 3

# Windows で拡大率の違うモニタ間をドラッグすると、ウインドウがちらつきながら伸び縮みを繰り返す
# winit 0.30.13 の不具合を直した写し（vendor/winit/README-vw.md）。上流が直した版を出したら外す。
# egui-wgpu 0.36.2 に描画先の形式を選べるようにした写し（vendor/egui-wgpu/README-vw.md）。10bit の表示に使う。
[patch.crates-io]
winit = { path = "vendor/winit" }
egui-wgpu = { path = "vendor/egui-wgpu" }

# 普段の clippy に足す lint。ここで宣言し、各クレートは `[lints] workspace = true` で継ぐ。
# pedantic 全体は入れない。`use_self` や `as` の精度の注意が 2,000 件を超え、直す差分が意味のある変更を埋めるため。
[workspace.lints.clippy]
# manual_midpoint は入れない。該当が浮動小数点の 17 箇所だけで桁あふれは起きず、
# `(size + 1.0) / 2.0`（中心画素）を `midpoint(size, 1.0)` に書き換えると意味が読みにくくなるため。
# significant_drop_tightening と match_same_arms も入れない。前者の該当 8 箇所はどれも lock の中身を
# 最後まで使っていて縮められず、後者の該当 19 箇所は guard 付きの腕や既定キーの一覧で、まとめると読みにくくなるため。
redundant_clone = "warn"
needless_pass_by_ref_mut = "warn"
# unsafe ブロックには、呼び出しが安全な前提を `// SAFETY:` で残す。
undocumented_unsafe_blocks = "warn"
