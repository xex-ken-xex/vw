[workspace]
resolver = "2"
members = ["crates/vw-core", "crates/vw-png", "crates/vw-dicom", "crates/vw-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
vw-core = { path = "crates/vw-core" }
vw-png = { path = "crates/vw-png" }
vw-dicom = { path = "crates/vw-dicom" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Image decoding is painfully slow unoptimized; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 3
