[workspace]
resolver = "2"
members = ["crates/vw-core", "crates/vw-png", "crates/vw-jpeg", "crates/vw-bmp", "crates/vw-webp", "crates/vw-raw", "crates/vw-dicom", "crates/vw-app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
vw-core = { path = "crates/vw-core" }
vw-png = { path = "crates/vw-png" }
vw-jpeg = { path = "crates/vw-jpeg" }
vw-bmp = { path = "crates/vw-bmp" }
vw-webp = { path = "crates/vw-webp" }
vw-raw = { path = "crates/vw-raw" }
vw-dicom = { path = "crates/vw-dicom" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Image decoding is painfully slow unoptimized; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 3
