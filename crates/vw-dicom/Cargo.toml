[package]
name = "vw-dicom"
description = "DICOM decoder plugin for vw"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vw-core.workspace = true
dicom-core = "0.10"
dicom-object = "0.10"
dicom-dictionary-std = "0.10"
dicom-pixeldata = { version = "0.10", default-features = false, features = ["jpeg", "rle", "openjpeg-sys", "charls"] }
dicom-ul = "0.10"
dicom-encoding = "0.10"
dicom-transfer-syntax-registry = { version = "0.10", default-features = false }

[dev-dependencies]
charls = { version = "0.4.2", features = ["static"] }
