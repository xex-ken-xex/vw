[package]
name = "vw-tiff"
description = "TIFF decoder plugin for vw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vw-core.workspace = true
tiff = { version = "0.11", features = ["webp"] }
# tar.xz・tar.zst を読むアプリと同じもの（新しい依存を足さないため）。
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz"] }
ruzstd = "0.9"

[lints]
workspace = true
