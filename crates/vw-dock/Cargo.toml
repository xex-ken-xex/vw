[package]
name = "vw-dock"
description = "vw's docking: panes split side by side or stacked, moved with Visual Studio-like guides, and pulled out into their own windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
egui = { version = "0.36", default-features = false }
serde = { version = "1", features = ["derive"] }
vw-ui = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
x11rb = "0.13"

[dev-dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
serde_json = "1"
egui-phosphor = "0.14"

[lints]
workspace = true
