[package]
name = "vw"
description = "Fast image viewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vw-core.workspace = true
vw-png.workspace = true
vw-jpeg.workspace = true
vw-webp.workspace = true
vw-raw.workspace = true
vw-dicom.workspace = true
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui-phosphor = "0.14"
serde = { version = "1", features = ["derive"] }
toml = "1"
notify = { version = "8", default-features = false }
serde_json = "1"
# ごみ箱へ送る。chrono は送ったものを一覧する API にしか要らない。
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }
# 読むだけなので、圧縮側（zopfli）や C ライブラリの要る方式は入れない。
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }

[dev-dependencies]
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(not(windows))'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
