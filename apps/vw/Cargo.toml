[package]
name = "vw"
description = "Fast image viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
vw-core.workspace = true
vw-png.workspace = true
vw-jpeg.workspace = true
vw-bmp.workspace = true
vw-webp.workspace = true
vw-gif.workspace = true
vw-tiff.workspace = true
vw-fits.workspace = true
vw-pipeline.workspace = true
vw-raw.workspace = true
vw-dicom.workspace = true
vw-quality.workspace = true
vw-compare.workspace = true
vw-report.workspace = true
vw-ui.workspace = true
vw-tree.workspace = true
vw-dock.workspace = true
vw-log.workspace = true
vw-launch.workspace = true
vw-renderer.workspace = true
eframe = { version = "0.36", default-features = false, features = ["glow", "wgpu_no_default_features", "default_fonts", "wayland", "x11"] }
egui-phosphor = "0.14"
# 16bit の画像を GPU に送るときに、u16 の並びをそのままバイトとして渡すため（eframe の wgpu も使っている）。
bytemuck = "1.25"
serde = { version = "1", features = ["derive"] }
toml = "1"
notify = { version = "8", default-features = false }
serde_json = "1"
rayon = "1"
regex = "1"
# 検索カタログの日時（UTC）と、ログの日時（地方時なので clock）を書く。
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# ごみ箱へ送る。chrono は送ったものを一覧する API にしか要らない。
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }
# 読むだけなので、圧縮側（zopfli）や C ライブラリの要る方式は入れない。
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "aes-crypto"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "bzip2", "ppmd"] }
# tar.bz2 / tar.xz は 7z が使うのと同じ純 Rust の実装で読む。tar.zst の ruzstd も純 Rust。
bzip2 = "0.6"
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz"] }
ruzstd = "0.9"
# 日本語の Windows で作った ZIP・tar の中の名前と、日本の QR コードの中身（Shift_JIS）を読む。
encoding_rs = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
ort = { version = "2.0.0-rc.14", default-features = false, features = ["load-dynamic"] }
tar = "0.4"
sha2 = "0.11"
sha1 = "0.11"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
raw-window-handle = "0.6"
# 純 Rust で C のライブラリが要らない。zbar（LGPL・C）や quircs より、配る物が増えないため。
rqrr = { version = "0.11", default-features = false }

[dev-dependencies]
png = "0.18"
# テスト用の tar.xz を作るため。
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "encoder"] }
# テスト用の 7z を作るため。アプリ本体は読むだけなので圧縮の機能は入れない。
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "compress", "util"] }
# テスト用の QR コードを作るため。
qrcode = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(unix)'.dependencies]
# 展開先の空き容量を調べる（statvfs）。
libc = "0.2"

[target.'cfg(not(windows))'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[lints]
workspace = true
