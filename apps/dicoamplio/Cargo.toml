[package]
name = "dicoamplio"
description = "DICOM のタグを書き換えて、評価用に患者・検査・シリーズ・画像を水増しする"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:vw-ui", "dep:vw-tree", "dep:vw-launch", "dep:vw-renderer"]

[dependencies]
dicom-core = "0.10"
dicom-dictionary-std = "0.10"
dicom-encoding = "0.10"
dicom-object = "0.10"
clap = { version = "4", features = ["derive"] }
rayon = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4", "v5"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
csv = "1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "1"
vw-ui = { workspace = true, optional = true }
vw-tree = { workspace = true, optional = true }
vw-launch = { workspace = true, optional = true }
vw-renderer = { workspace = true, optional = true }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"], optional = true }
dicom-ul = "0.10"
dicom-transfer-syntax-registry = "0.10"

# Windows で、コマンドラインから使うときに起動元のコンソールへ出力をつなぐ(main.rs の attach_console)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

