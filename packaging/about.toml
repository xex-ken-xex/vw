# cargo-about の設定。配布物に同梱する THIRD-PARTY-LICENSES.txt を作る。
# ここに無いライセンスの依存が入ると生成が失敗する。採用前に条件を確かめるための関所として使う。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "IJG",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # egui の等幅フォント Hack の元になった Bitstream Vera。名前を変えずに改変しなければ再配布できる。
    "Bitstream-Vera",
    # カメラ RAW の rawler。vw のソースを公開しているので、利用者が rawler を差し替えて
    # 作り直せるという LGPL の条件を満たせる。
    "LGPL-2.1",
    # 7z の bzip2 圧縮に使う libbz2-rs-sys。元の bzip2 と同じ BSD 系の条件で、著作権表示を残せばよい。
    "bzip2-1.0.6",
    # モデルのダウンロード（ureq）が使う Mozilla のルート証明書集（webpki-roots）。
    # 表示と再配布に条件のない permissive なライセンス。
    "CDLA-Permissive-2.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# 以下は、crate の license 欄だけでは同梱しているものの表記が抜けるもの。
# checksum はそのファイルの SHA-256。crate の版を上げてファイルが変わると生成が失敗するので、
# そのときは中身を読み直してから値を書き換える。

# egui の既定のフォント。等幅の Hack は MIT と Bitstream Vera License の 2 つで、
# crate の license 欄に Bitstream Vera が無いため、そのまま生成するとこの条文が載らない。
[epaint_default_fonts.clarify]
license = "MIT AND OFL-1.1 AND Ubuntu-font-1.0 AND Bitstream-Vera"

[[epaint_default_fonts.clarify.files]]
path = "fonts/Hack-Regular.txt"
license = "MIT AND Bitstream-Vera"
checksum = "47c0cccbeec7e8614548cc485588b28149e7874188df5f41b36efebcee285c87"

[[epaint_default_fonts.clarify.files]]
path = "fonts/emoji-icon-font-mit-license.txt"
license = "MIT"
checksum = "b9d2c1d909aa149996fd4c91dcb92b2362a04431640c1d200959da94caf8cde1"

[[epaint_default_fonts.clarify.files]]
path = "fonts/OFL.txt"
license = "OFL-1.1"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"

[[epaint_default_fonts.clarify.files]]
path = "fonts/UFL.txt"
license = "Ubuntu-font-1.0"
checksum = "2f0015108d68627bd788d313f529c21ff4da2c2c42a5e1f3883acc83480f9002"

# JPEG-LS の CharLS（C++）。crate の license 欄は Rust の包みの MIT だけで、
# 一緒にビルドして入る CharLS 本体の BSD-3-Clause が載らない。
[charls-sys.clarify]
license = "MIT AND BSD-3-Clause"

[[charls-sys.clarify.files]]
path = "LICENSE.md"
license = "MIT"
checksum = "b2c06a33544de153d64c76ad9f2cb69c61224815aecde5fe4bc4de676595e2a5"

