# cargo-about の設定。配布物に同梱する THIRD-PARTY-LICENSES.txt を作る。
# ここに無いライセンスの依存が入ると生成が失敗する。採用前に条件を確かめるための関所として使う。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "IJG",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # カメラ RAW の rawler。vw のソースを公開しているので、利用者が rawler を差し替えて
    # 作り直せるという LGPL の条件を満たせる。
    "LGPL-2.1",
    # 7z の bzip2 圧縮に使う libbz2-rs-sys。元の bzip2 と同じ BSD 系の条件で、著作権表示を残せばよい。
    "bzip2-1.0.6",
    # モデルのダウンロード（ureq）が使う Mozilla のルート証明書集（webpki-roots）。
    # 表示と再配布に条件のない permissive なライセンス。
    "CDLA-Permissive-2.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
